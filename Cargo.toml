[package]
name = "buttonscli"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "A fast, native terminal workspace"
license = "MIT OR Apache-2.0"
keywords = ["terminal", "emulator", "egui", "alacritty"]
categories = ["command-line-utilities", "gui"]

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "buttonscli"
path = "src/main.rs"
required-features = ["desktop"]

[features]
default = ["desktop"]
desktop = []

[dependencies]
eframe = { version = "0.31.1", default-features = false, features = ["default_fonts", "persistence"] }
egui = "0.31.1"
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
url = "2.5"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
anyhow = "1.0"
fastrand = "2.5"
zeroize = "1.8"
reqwest = { version = "0.12.25", default-features = false, features = ["blocking", "json", "rustls-tls"] }
fs2 = "0.4.3"
sha2 = "0.10"
home = "0.5.12"
eframe = { version = "0.31.1", default-features = false, features = ["wgpu", "wayland", "x11"] }
egui_term = { path = "vendor/egui_term" }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "=3.6.3", default-features = false, features = ["windows-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "=3.6.3", default-features = false, features = ["sync-secret-service", "crypto-rust", "vendored"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "=3.6.3", default-features = false, features = ["apple-native"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
eframe = { version = "0.31.1", default-features = false, features = ["glow"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Document", "Element", "HtmlCanvasElement", "Window"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[profile.dev]
debug = 1

# wasm-pack 0.15 currently downloads a Binaryen build whose validator does not
# enable the bulk-memory instructions emitted by Rust 1.97. The Rust release
# profile is still optimized; skip only wasm-pack's incompatible second pass.
[package.metadata.wasm-pack.profile.release]
wasm-opt = false
