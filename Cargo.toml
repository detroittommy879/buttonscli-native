[package]
name = "buttonscli"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "A fast, native terminal workspace"
license = "MIT OR Apache-2.0"
repository = "https://github.com/buttonscli/buttonscli-native"
keywords = ["terminal", "emulator", "egui", "alacritty"]
categories = ["command-line-utilities", "gui"]

[dependencies]
anyhow = "1.0"
eframe = { version = "0.31.1", default-features = false, features = ["default_fonts", "persistence", "wgpu", "wayland", "x11"] }
egui = "0.31.1"
serde = { version = "1.0", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
egui_term = { path = "vendor/egui_term" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Document", "Element", "Window"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[profile.dev]
debug = 1
