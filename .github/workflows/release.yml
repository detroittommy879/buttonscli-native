name: Release builds

# Never runs on merges. Start it from the Actions tab ("Run workflow") or with
# `gh workflow run release.yml`. Tick "publish" to put the files on a draft
# GitHub release; you publish the draft yourself.
#
# The version is picked for you (Semantic Versioning, docs/dev/RELEASING.md):
# scripts/release-version.sh bumps the newest release by the commit messages
# since it (feat: -> minor, anything else -> patch) or by the "bump" choice.
# Breaking commits stop the run until you choose. The run summary shows the
# version and why; a run without "publish" is a dry run. Every job builds with
# that one number.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump. auto: feat commits -> minor, others -> patch; breaking commits stop and ask"
        type: choice
        options: [auto, patch, minor, major]
        default: auto
      publish:
        description: Attach the files to a draft GitHub release
        type: boolean
        default: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    runs-on: ubuntu-latest
    # Write access only so `gh release list` also sees draft releases.
    permissions:
      contents: write
    outputs:
      version: ${{ steps.next.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: next
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(bash scripts/release-version.sh next "${{ inputs.bump }}")
          echo "Release version: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  windows:
    needs: version
    runs-on: windows-latest
    env:
      BUTTONSCLI_RELEASE_BUILD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - shell: bash
        run: bash scripts/release-version.sh apply "${{ needs.version.outputs.version }}"
      - run: cargo build --release --locked --bin buttonscli --bin buttonsclictl
      - name: Zip the exe
        shell: pwsh
        run: |
          $version = (cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages.Where({ $_.name -eq 'buttonscli' }).version
          $dir = "buttonscli-$version-windows-x64"
          New-Item -ItemType Directory $dir | Out-Null
          Copy-Item target/release/buttonscli.exe, target/release/buttonsclictl.exe, README.md, LICENSE-MIT, LICENSE-APACHE, THIRD_PARTY.md $dir
          Compress-Archive -Path $dir -DestinationPath "$dir.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: buttonscli-*-windows-x64.zip

  linux:
    needs: version
    # The oldest supported Ubuntu runner, so the binary works on older glibc.
    runs-on: ubuntu-22.04
    env:
      BUTTONSCLI_RELEASE_BUILD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: bash scripts/release-version.sh apply "${{ needs.version.outputs.version }}"
      - name: Install Linux window dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxkbcommon-dev libwayland-dev pkg-config
      - run: cargo build --release --locked --bin buttonscli --bin buttonsclictl
      - name: Make the tarball and AppImage
        env:
          # appimagetool is itself an AppImage; runners have no FUSE.
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "buttonscli") | .version')
          dir="buttonscli-$version-linux-x86_64"
          mkdir "$dir"
          cp target/release/buttonscli target/release/buttonsclictl README.md LICENSE-MIT LICENSE-APACHE THIRD_PARTY.md "$dir"/
          # For packaging/install/install.sh (launcher entry and icon).
          cp packaging/icon-256.png "$dir"/buttonscli.png
          cp packaging/buttonscli.desktop "$dir"/
          tar czf "$dir.tar.gz" "$dir"

          mkdir -p AppDir/usr/bin
          cp target/release/buttonscli target/release/buttonsclictl AppDir/usr/bin/
          cp packaging/buttonscli.desktop AppDir/
          cp packaging/icon.png AppDir/buttonscli.png
          ln -s usr/bin/buttonscli AppDir/AppRun
          curl -fsSL -o appimagetool https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          ARCH=x86_64 ./appimagetool AppDir "ButtonsCLI-$version-x86_64.AppImage"
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            buttonscli-*-linux-x86_64.tar.gz
            ButtonsCLI-*-x86_64.AppImage

  macos:
    needs: version
    runs-on: macos-latest
    env:
      BUTTONSCLI_RELEASE_BUILD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - run: bash scripts/release-version.sh apply "${{ needs.version.outputs.version }}"
      - run: cargo build --release --locked --bin buttonscli --bin buttonsclictl --target aarch64-apple-darwin
      - run: cargo build --release --locked --bin buttonscli --bin buttonsclictl --target x86_64-apple-darwin
      - name: Make the universal .app and .dmg
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "buttonscli") | .version')
          app=ButtonsCLI.app
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          lipo -create -output "$app/Contents/MacOS/buttonscli" \
            target/aarch64-apple-darwin/release/buttonscli \
            target/x86_64-apple-darwin/release/buttonscli
          lipo -create -output "$app/Contents/MacOS/buttonsclictl"             target/aarch64-apple-darwin/release/buttonsclictl             target/x86_64-apple-darwin/release/buttonsclictl
          sed "s/@VERSION@/$version/g" packaging/Info.plist > "$app/Contents/Info.plist"

          mkdir icon.iconset
          for size in 16 32 128 256 512; do
            sips -z $size $size packaging/icon.png --out icon.iconset/icon_${size}x${size}.png >/dev/null
            sips -z $((size * 2)) $((size * 2)) packaging/icon.png --out icon.iconset/icon_${size}x${size}@2x.png >/dev/null
          done
          iconutil -c icns icon.iconset -o "$app/Contents/Resources/buttonscli.icns"

          # Ad-hoc signature only: not notarized, so first launch needs
          # right-click > Open (or Privacy & Security > Open Anyway).
          codesign --force --deep --sign - "$app"

          mkdir dmg
          cp -R "$app" dmg/
          ln -s /Applications dmg/Applications
          # hdiutil underestimates -srcfolder size for large binaries
          # ("No space left on device"); give it explicit headroom.
          size_mb=$(( $(du -sm dmg | cut -f1) * 2 + 20 ))
          hdiutil create -volname ButtonsCLI -srcfolder dmg -fs HFS+ \
            -size "${size_mb}m" -format UDZO "ButtonsCLI-$version-macos-universal.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: ButtonsCLI-*-macos-universal.dmg

  release:
    if: inputs.publish
    needs: [version, windows, linux, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Draft the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${{ needs.version.outputs.version }}"
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null \
            || gh release view "v$version" >/dev/null 2>&1; then
            echo "v$version was taken while this run was building. Run the workflow again." >&2
            exit 1
          fi
          cd dist
          sha256sum * > SHA256SUMS.txt
          gh release create "v$version" --draft --target "$GITHUB_SHA" \
            --title "ButtonsCLI $version" \
            --notes "Unsigned test builds. Windows may show a SmartScreen warning, and on macOS right-click the app and choose Open the first time." \
            ./*
