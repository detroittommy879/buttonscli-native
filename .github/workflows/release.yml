name: Release builds

# Never runs on merges. Start it from the Actions tab ("Run workflow") or with
# `gh workflow run release.yml`. Tick "publish" to put the files on a draft
# GitHub release for `v<Cargo.toml version>`; you publish the draft yourself.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Attach the files to a draft GitHub release
        type: boolean
        default: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --locked --bin buttonscli
      - name: Zip the exe
        shell: pwsh
        run: |
          $version = (cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages.Where({ $_.name -eq 'buttonscli' }).version
          $dir = "buttonscli-$version-windows-x64"
          New-Item -ItemType Directory $dir | Out-Null
          Copy-Item target/release/buttonscli.exe, README.md, LICENSE-MIT, LICENSE-APACHE, THIRD_PARTY.md $dir
          Compress-Archive -Path $dir -DestinationPath "$dir.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: buttonscli-*-windows-x64.zip

  linux:
    # The oldest supported Ubuntu runner, so the binary works on older glibc.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux window dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxkbcommon-dev libwayland-dev pkg-config
      - run: cargo build --release --locked --bin buttonscli
      - name: Make the tarball and AppImage
        env:
          # appimagetool is itself an AppImage; runners have no FUSE.
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "buttonscli") | .version')
          dir="buttonscli-$version-linux-x86_64"
          mkdir "$dir"
          cp target/release/buttonscli README.md LICENSE-MIT LICENSE-APACHE THIRD_PARTY.md "$dir"/
          tar czf "$dir.tar.gz" "$dir"

          mkdir -p AppDir/usr/bin
          cp target/release/buttonscli AppDir/usr/bin/
          cp packaging/buttonscli.desktop AppDir/
          cp packaging/icon.png AppDir/buttonscli.png
          ln -s usr/bin/buttonscli AppDir/AppRun
          curl -fsSL -o appimagetool https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          ARCH=x86_64 ./appimagetool AppDir "ButtonsCLI-$version-x86_64.AppImage"
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            buttonscli-*-linux-x86_64.tar.gz
            ButtonsCLI-*-x86_64.AppImage

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - run: cargo build --release --locked --bin buttonscli --target aarch64-apple-darwin
      - run: cargo build --release --locked --bin buttonscli --target x86_64-apple-darwin
      - name: Make the universal .app and .dmg
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "buttonscli") | .version')
          app=ButtonsCLI.app
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          lipo -create -output "$app/Contents/MacOS/buttonscli" \
            target/aarch64-apple-darwin/release/buttonscli \
            target/x86_64-apple-darwin/release/buttonscli
          sed "s/@VERSION@/$version/g" packaging/Info.plist > "$app/Contents/Info.plist"

          mkdir icon.iconset
          for size in 16 32 128 256 512; do
            sips -z $size $size packaging/icon.png --out icon.iconset/icon_${size}x${size}.png >/dev/null
            sips -z $((size * 2)) $((size * 2)) packaging/icon.png --out icon.iconset/icon_${size}x${size}@2x.png >/dev/null
          done
          iconutil -c icns icon.iconset -o "$app/Contents/Resources/buttonscli.icns"

          # Ad-hoc signature only: not notarized, so first launch needs
          # right-click > Open (or Privacy & Security > Open Anyway).
          codesign --force --deep --sign - "$app"

          mkdir dmg
          cp -R "$app" dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname ButtonsCLI -srcfolder dmg -format UDZO "ButtonsCLI-$version-macos-universal.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: ButtonsCLI-*-macos-universal.dmg

  release:
    if: inputs.publish
    needs: [windows, linux, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Draft the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null; then
            echo "Tag v$version already exists. Bump the version in Cargo.toml first." >&2
            exit 1
          fi
          cd dist
          sha256sum * > SHA256SUMS.txt
          gh release create "v$version" --draft --target "$GITHUB_SHA" \
            --title "ButtonsCLI $version" \
            --notes "Unsigned test builds. Windows may show a SmartScreen warning, and on macOS right-click the app and choose Open the first time." \
            ./*
