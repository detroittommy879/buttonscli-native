name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  native-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install Linux window dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxkbcommon-dev libwayland-dev pkg-config
      - run: cargo fmt --all -- --check
      - run: cargo test
      - run: cargo test -p egui_term
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo clippy -p egui_term --all-targets -- -D warnings

  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Headless terminal pipeline benchmark
        # `cargo run -p` needs a workspace member; build then run the example.
        run: |
          cargo build --release --locked -p egui_term --example term_bench
          ./target/release/examples/term_bench --quick --json bench.json
      - uses: actions/upload-artifact@v4
        with:
          name: term-bench
          path: bench.json

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - run: cargo clippy --target wasm32-unknown-unknown --no-default-features -- -D warnings
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npx --yes wasm-pack@0.15.0 build --target web --out-dir web/pkg --no-default-features -- --locked
      - uses: actions/upload-artifact@v4
        with:
          name: buttonscli-web-preview
          path: |
            web/index.html
            web/simulator.js
            web/pkg/buttonscli.js
            web/pkg/buttonscli_bg.wasm
