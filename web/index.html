<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="color-scheme" content="dark" />
<title>Try ButtonsCLI</title>
<style>
* { box-sizing: border-box; }
html, body { margin: 0; width: 100%; height: 100%; background: #090c16; color: #dce4f2; }
body { display: flex; flex-direction: column; overflow: hidden; font: 14px/1.4 system-ui, sans-serif; }
header { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 8px 12px; border-bottom: 1px solid #263044; }
header span { color: #9aaac1; }
button, .file-button { border: 1px solid #35435a; border-radius: 6px; padding: 6px 10px; background: #182238; color: inherit; font: inherit; cursor: pointer; }
button:hover, .file-button:hover { background: #263853; }
button:disabled { opacity: .5; cursor: wait; }
.file-button:focus-within { outline: 2px solid #38bdf8; }
input[type=file] { position: absolute; width: 1px; height: 1px; opacity: 0; }
#stage { position: relative; flex: 1; min-height: 0; }
canvas { width: 100%; height: 100%; display: block; }
#status { font-size: 12px; }
#fallback { display: none; padding: 2rem; max-width: 600px; }
#loading { position: absolute; inset: 0; display: grid; place-items: center; background: #090c16; }
/* ?embed: compact header for use inside another page */
body.embed header { gap: 6px; padding: 4px 8px; font-size: 12px; }
body.embed header strong, body.embed #build, body.embed #desktop-prompts, body.embed .file-button { display: none; }
body.embed button { padding: 3px 8px; }
</style>
</head>
<body>
<header>
<strong>ButtonsCLI · browser preview</strong>
<span id="build" title="Compiled source revision and build time"></span>
<button id="settings" disabled>Themes &amp; Settings</button>
<button id="prompt-settings" disabled>Simulator prompts</button>
<button id="offline-mode" disabled>Offline practice</button>
<button id="ai-mode" disabled>AI simulator</button>
<button id="desktop-prompts" hidden>Load desktop prompts</button>
<label class="file-button">Load theme JSON<input id="theme-file" type="file" accept=".json,application/json" disabled /></label>
<span id="status" role="status">Loading app…</span>
</header>
<main id="stage">
<canvas id="buttonscli_canvas" aria-label="Interactive ButtonsCLI preview"></canvas>
<div id="loading">Starting ButtonsCLI…</div>
<div id="fallback" role="alert"><strong>The preview could not start.</strong><p id="failure-detail"></p><p>Serve the complete web folder over HTTP(S), with WebGL enabled in your browser.</p><button id="retry">Try again</button></div>
</main>
<script type="module">
if (new URLSearchParams(location.search).has("embed")) document.body.classList.add("embed");
const status = document.getElementById("status");
const file = document.getElementById("theme-file");
const settings = document.getElementById("settings");
document.getElementById("retry").addEventListener("click", () => location.reload());
try {
  let version = "";
  try {
    const response = await fetch("./build-info.json", { cache: "no-store" });
    if (response.ok) {
      const receipt = await response.json();
      version = receipt.wasmSha256;
      document.getElementById("build").textContent = receipt.revision.slice(0, 8);
      document.getElementById("build").title = `Built ${receipt.builtAt} · ${receipt.revision}`;
    }
  } catch { /* A receipt is optional for manually built packages. */ }
  const suffix = version ? `?v=${encodeURIComponent(version)}` : "";
  const { default: init, WebHandle } = await import(`./pkg/buttonscli.js${suffix}`);
  await init({ module_or_path: new URL(`./pkg/buttonscli_bg.wasm${suffix}`, import.meta.url) });
  const app = new WebHandle();
  await app.start(document.getElementById("buttonscli_canvas"));
  window.buttonscli = app;
  // Demo visitors get their browser language without a first-run dialog.
  try { app.skip_onboarding(); } catch { /* still starting */ }
  document.getElementById("loading").remove();
  settings.disabled = file.disabled = false;
  const { connectSimulator } = await import(`./simulator.js${suffix}`);
  await connectSimulator(app, status);
  settings.addEventListener("click", () => {
    try { app.open_settings(); } catch (error) { status.textContent = String(error); }
  });
  file.addEventListener("change", async () => {
    const selected = file.files[0];
    if (!selected) return;
    try {
      if (selected.size > 1048576) throw new Error("Theme files must be smaller than 1 MB.");
      const name = app.import_theme(await selected.text());
      status.textContent = `Loaded ${name}`;
    } catch (error) {
      status.textContent = `Could not load theme: ${error}`;
    } finally { file.value = ""; }
  });
} catch (error) {
  document.getElementById("loading").remove();
  document.getElementById("buttonscli_canvas").style.display = "none";
  document.getElementById("fallback").style.display = "block";
  document.getElementById("failure-detail").textContent = String(error);
  status.textContent = "Preview unavailable";
  console.error("ButtonsCLI web demo failed to start", error);
}
</script>
</body>
</html>
